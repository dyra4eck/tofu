default:
  image:
    name: ghcr.io/opentofu/opentofu:1.10.6
    entrypoint: [""]
  tags:
    - tf

stages:
  - validate
  - plan

validate:
  stage: validate 
  script:
    - tofu fmt -check -recursive -diff
    - tofu init -backend=false
    - tofu validate

plan:
  stage: plan
  script:
    - |
      HOST="${STAND_FQDN%%.*}"
      ZONE="${STAND_FQDN#*.}"
      if [ "$HOST" = "$ZONE" ]; then
        echo "STAND_FQDN должен быть FQDN: $STAND_FQDN"
        exit 1
      fi

      if ! echo "$STAND_MEMORY" | grep -Eq '^[0-9]+$'; then
        echo "RAM задан не как число: $STAND_MEMORY"
        exit 1
      fi

      if [ "$STAND_MEMORY" -gt 50 ]; then 
        echo "Чрезмерное выделение RAM: $STAND_MEMORY > 50"
        exit 1
      fi

      case "$STAND_OS" in 
        redos|astra)
        ;;
        *)
        echo "STAND_OS задан неверно: $STAND_OS"
        exit 1
        ;;
      esac

      PVE_API="https://10.205.251.3:8006/api2/json"
      VMID=""

      for id in $(seq 302 305); do
        if  wget -qO /dev/null --no-check-certificate \
              --header="Authorization: PVEAPIToken=$PROXMOX_VE_API_TOKEN" \
              "$PVE_API/cluster/nextid?vmid=$id"; then
            VMID="$id"
            break;
        fi
      done

      if [ -z "$VMID" ]; then
        echo "Нет свободных VMID в диапазоне"
        exit 1
      fi
      echo "$VMID"      
      echo "$HOST | $ZONE"

      EXTRA=""
      [ -n "${STAND_NODE_NAME}" ] && EXTRA="${EXTRA} node_name = ${STAND_NODE_NAME}\n"
      [ -n "${STAND_POOL_ID}" ] && EXTRA="${EXTRA} pool_id = ${STAND_POOL_ID}\n"
      [ -n "${STAND_IP}" ] && EXTRA="${EXTRA} ip = ${STAND_IP}\n"
      [ -n "${STAND_GATEWAY}" ] && EXTRA="${EXTRA} gateway = ${STAND_GATEWAY}\n"
      [ -n "${STAND_VLAN_ID}" ] && EXTRA="${EXTRA} vlan_id = ${STAND_VLAN_ID}\n"
      [ -n "${STAND_MAC_ADDRESS}" ] && EXTRA="${EXTRA} mac_address = ${STAND_MAC_ADDRESS}\n"
      [ -n "${STAND_CORES}" ] && EXTRA="${EXTRA} cores = ${STAND_CORES}\n"
      [ -n "${STAND_SOCKETS}" ] && EXTRA="${EXTRA} sockets = ${STAND_SOCKETS}\n"
      [ -n "${STAND_MEMORY}" ] && EXTRA="${EXTRA} memory = $(( STAND_MEMORY * 1024 ))\n"
      [ -n "${STAND_DISK}" ] && EXTRA="${EXTRA} disk = ${STAND_DISK}\n"
      [ -n "${STAND_ON_BOOT}" ] && EXTRA="${EXTRA} on_boot = ${STAND_ON_BOOT}\n"
      [ -n "${STAND_STARTED}" ] && EXTRA="${EXTRA} started = ${STAND_STARTED}\n"
      [ -n "${STAND_PROTECTION}" ] && EXTRA="${EXTRA} protection = ${STAND_PROTECTION}\n"
      [ -n "${STAND_BACKUP}" ] && EXTRA="${EXTRA} backup = ${STAND_BACKUP}\n"
      [ -n "${STAND_TAGS}" ] && EXTRA="${EXTRA} tags = ${STAND_TAGS}\n"
      [ -n "${STAND_DESCRIPTION}" ] && EXTRA="${EXTRA} description = ${STAND_DESCRIPTION}"
      
      cat  > pipeline.auto.tfvars <<EOF
      pve_endpoint = "https://10.205.251.3:8006/"
      node_name    = "pve03"
      pool_id      = "TEST_TF"
      
      vm_id_range    = [302, 349]
      template_vm_id = 350
      vms = {
        "${HOST}" = {
          vm_id = ${VMID}
          ${EXTRA}
        }
      }
      EOF

      ls -la
      cat pipeline.auto.tfvars

      export TF_VAR_pve_token="$PROXMOX_VE_API_TOKEN"
      export TF_HTTP_USERNAME="gitlab-ci-token"
      export TF_HTTP_PASSWORD="${CI_JOB_TOKEN}"
      export TF_HTTP_ADDRESS="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/stand-${HOST}"
      export TF_HTTP_LOCK_ADDRESS="${TF_HTTP_ADDRESS}/lock"
      export TF_HTTP_UNLOCK_ADDRESS="${TF_HTTP_ADDRESS}/lock"
      export TF_HTTP_LOCK_METHOD=POST
      export TF_HTTP_UNLOCK_METHOD=DELETE

      tofu init
      tofu plan -out=tfplan
      tofu show -json tfplan > plan.json
      cat plan.json

  artifacts:
    paths:
      - pipeline.auto.tfvars
      - tfplan
  rules:
    - if: '$STAND_FQDN && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "trigger")'
      when: on_success
    - when: never

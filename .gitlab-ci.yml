default:
  image:
    name: ghcr.io/opentofu/opentofu:1.10.6
    entrypoint: [""]
  tags:
    - tf

stages:
  - validate
  - plan

validate:
  stage: validate 
  script:
    - tofu fmt -check -recursive -diff
    - tofu init -backend=false
    - tofu validate

plan:
  stage: plan
  script:
    - |
      HOST="${STAND_FQDN%%.*}"
      ZONE="${STAND_FQDN#*.}"
      if [ "$HOST" = "$ZONE" ]; then
        echo "STAND_FQDN должен быть FQDN: $STAND_FQDN"
        exit 1
      fi

      if ! echo "$STAND_RAM" | grep -Eq '^[0-9]+$'; then
        echo "RAM задан не как число: $STAND_RAM"
        exit 1

      if [ "$STAND_RAM" -gt 50 ]; then 
        echo "Чрезмерное выделение RAM: $STAND_RAM > 50"
        exit 1
      fi

      case "$STAND_OS" in 
        redos|astra)
        ;;
        *)
        echo "STAND_OS задан неверно: $STAND_OS"
        exit 1
        ;;
      esac

      echo "$HOST | $ZONE"
  rules:
    - if: '$STAND_FQDN && $STAND_OS && $STAND_RAM && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "trigger")'
      when: on_success
    - when: never

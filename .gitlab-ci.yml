default:
  image:
    name: ghcr.io/opentofu/opentofu:1.10.6
    entrypoint: [""]
  tags:
    - tf

.tf_backend: &tf_backend |  
  export TF_VAR_pve_token="$PROXMOX_VE_API_TOKEN"
  export TF_HTTP_USERNAME="gitlab-ci-token"
  export TF_HTTP_PASSWORD="${CI_JOB_TOKEN}"
  export TF_HTTP_ADDRESS="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/stand-${HOST}"
  export TF_HTTP_LOCK_ADDRESS="${TF_HTTP_ADDRESS}/lock"
  export TF_HTTP_UNLOCK_ADDRESS="${TF_HTTP_ADDRESS}/lock"
  export TF_HTTP_LOCK_METHOD=POST
  export TF_HTTP_UNLOCK_METHOD=DELETE
  [ -n "$STAND_PASSWORD_HASH_B64" ] && export TF_VAR_password_hash="$(printf '%s' "$STAND_PASSWORD_HASH_B64" | tr -d '[:space:]' | base64 -d)"
  [ -n "$STAND_NODE_NAME" ] && export TF_VAR_node_name="$STAND_NODE_NAME" || true

.from_state:  &from_state |
  tofu show -json > cur.json
  Q='.values.root_module.resources[] | select(.type=="proxmox_virtual_environment_vm")'
  NODE=$(jq -r "$Q | .values.node_name" cur.json)
  CORES=$(jq -r "$Q | .values.cpu[0].cores" cur.json)
  SOCK=$(jq -r "$Q | .values.cpu[0].sockets" cur.json)
  MEM=$(jq -r "$Q | .values.memory[0].dedicated" cur.json)
  DISK=$(jq -r "$Q | .values.disk[0].size" cur.json)
  POOL=$(jq -r "$Q | .values.pool_id" cur.json)
  VLAN=$(jq -r "$Q | .values.network_device[0].vlan_id" cur.json)
  VD=$(jq -r "$Q | .values.initialization[0].vendor_data_file_id" cur.json)

  for v in NODE CORES MEM DISK; do
    eval "val=\$$v"
    [ -n "$val" ] && [ "$val" != "null" ] || { echo "$v не нашелся в state"; exit 1; }
  done

  case "$VD" in *astra*) OS=astra ;; *) OS=redos ;; esac
  export TF_VAR_node_name="$NODE"

.find_backup: &find_backup |
  NODE="${STAND_NODE_NAME:-pve03}"
  AUTH="Authorization: PVEAPIToken=${PROXMOX_VE_API_TOKEN}"

  BK=$(curl -sk -H "$AUTH" \
    "${PVE_API}/nodes/${NODE}/storage/${BACKUP_STORAGE}/content?content=backup" \
    | jq -r --arg h "$HOST" '
        [ .data[]
          | select(.notes != null)
          | select(.notes | test("(^|\\s)" + $h + "(\\s|$)"))
        ] | sort_by(.ctime) | last // empty')

  [ -n "$BK" ] || { echo "бэкап для $HOST не найден в ${BACKUP_STORAGE}"; exit 1; }

  VOLID=$(echo "$BK" | jq -r '.volid')
  BSIZE=$(echo "$BK" | jq -r '.size')
  BDATE=$(echo "$BK" | jq -r '.ctime | strftime("%Y-%m-%d %H:%M:%S")')
  OLDVMID=$(echo "$VOLID" | sed -n 's|.*/vm/\([0-9]\+\)/.*|\1|p')

  [ "$BSIZE" -gt 1073741824 ] || { echo "бэкап подозрительно мал ($BSIZE) - отказ"; exit 1; }

  echo "найден: $VOLID"
  echo "дата:   $BDATE"
  echo "размер: $BSIZE байт"
  echo "прежний VMID: $OLDVMID"

stages:
  - validate
  - plan
  - apply
  - destroy
  - archive

validate:
  stage: validate 
  script:
    - tofu fmt -check -recursive -diff
    - tofu init -backend=false
    - tofu validate

plan:
  resource_group: $STAND_FQDN
  stage: plan
  script:
    - |
      for v in STAND_FQDN STAND_OS STAND_MEMORY STAND_DISK STAND_CORES; do
        eval "val=\$$v"
        [ -n "$val" ] || { echo "Не задана обязательная переменная $v"; exit 1; }
      done

      HOST="${STAND_FQDN%%.*}"
      ZONE="${STAND_FQDN#*.}"
      [ -n "$HOST" ] || { echo "STAND_FQDN не задан"; exit 1; }
      if [ "$HOST" = "$ZONE" ]; then
        echo "STAND_FQDN должен быть FQDN: $STAND_FQDN"
        exit 1
      fi

      if ! echo "$STAND_MEMORY" | grep -Eq '^[0-9]+$'; then
        echo "STAND_MEMORY задан не как число: $STAND_MEMORY"
        exit 1
      fi

      if ! echo "$STAND_CORES" | grep -Eq '^[0-9]+$'; then
        echo "STAND_CORES задан не как число: $STAND_CORES"
        exit 1
      fi

      if ! echo "$STAND_DISK" | grep -Eq '^[0-9]+$'; then
        echo "STAND_DISK задан не как число: $STAND_DISK"
        exit 1
      fi

      if [ "$STAND_MEMORY" -gt 50 ]; then 
        echo "Чрезмерное выделение RAM: $STAND_MEMORY > 50"
        exit 1
      fi

      case "$STAND_OS" in 
        redos)
          TEMPLATE_ID="${REDOS_TEMPLATE_ID}" ;;
        astra)
          TEMPLATE_ID="${ASTRA_TEMPLATE_ID}" ;;
        *)
        echo "STAND_OS задан неверно: $STAND_OS. Варианты: astra | redos"; exit 1 ;;
      esac
      [ -n "$TEMPLATE_ID" ] || { echo "TEMPLATE_ID не определен (STAND_OS=$STAND_OS)"; exit 1; }

      #PVE_API="https://10.205.251.3:8006/api2/json"
      #VMID=""
      #for id in $(seq 302 350); do
      #  if  wget -qO /dev/null --no-check-certificate \
      #        --header="Authorization: PVEAPIToken=$PROXMOX_VE_API_TOKEN" \
      #        "$PVE_API/cluster/nextid?vmid=$id"; then
      #      VMID="$id"
      #      break;
      #  fi
      #done
      #if [ -z "$VMID" ]; then
      #  echo "Нет свободных VMID в диапазоне"
      #  exit 1
      #fi
      #echo "$VMID"      
      echo "$HOST | $ZONE"

      EXTRA=""
      add() { EXTRA="${EXTRA} 
          $1"; }

      [ -n "${STAND_POOL_ID}" ] && add "pool_id = \"${STAND_POOL_ID}\""
      [ -n "${STAND_IP}" ] && add "ip = \"${STAND_IP}\""
      [ -n "${STAND_GATEWAY}" ] && add "gateway = \"${STAND_GATEWAY}\""
      [ -n "${STAND_VLAN_ID}" ] && add "vlan_id = ${STAND_VLAN_ID}"
      [ -n "${STAND_MAC_ADDRESS}" ] && add "mac_address = \"${STAND_MAC_ADDRESS}\""
      [ -n "${STAND_CORES}" ] && add "cores = ${STAND_CORES}"
      [ -n "${STAND_MEMORY}" ] && add "memory = $(( STAND_MEMORY * 1024 ))"
      [ -n "${STAND_DISK}" ] && add "disk = ${STAND_DISK}"
      [ -n "${STAND_ON_BOOT}" ] && add "on_boot = ${STAND_ON_BOOT}"
      [ -n "${STAND_STARTED}" ] && add "started = \"${STAND_STARTED}\""
      [ -n "${STAND_PROTECTION}" ] && add "protection = \"${STAND_PROTECTION}\""
      [ -n "${STAND_BACKUP}" ] && add "backup = \"${STAND_BACKUP}\""
      [ -n "${STAND_TAGS}" ] && add "tags = [\"$(echo "$STAND_TAGS" | sed 's/,/", "/g')\"]"
      [ -n "${STAND_DESCRIPTION}" ] && add "description = \"${STAND_DESCRIPTION}\""
      cat  > pipeline.auto.tfvars <<EOF
      pve_endpoint = "https://10.205.251.3:8006/"
      pool_id      = "NONAME"
      
      template_vm_id = ${TEMPLATE_ID}
      stand_os = "${STAND_OS}"
      vms = {
        "${HOST}" = {
          ${EXTRA}
        }
      }
      EOF

      ls -la
      cat pipeline.auto.tfvars

    - *tf_backend
    - tofu init
    - tofu plan -out=tfplan
    - tofu show -json tfplan > plan.json

  artifacts:
    paths:
      - pipeline.auto.tfvars
      - tfplan
  rules:
    - if: '$STAND_FQDN && !$STAND_ACTION && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "trigger")'
      when: on_success
    - when: never

apply:
  resource_group: $STAND_FQDN
  stage: apply
  needs: [plan]
  script:
    - |
      HOST="${STAND_FQDN%%.*}"
    - *tf_backend
    - tofu init
    - tofu apply -input=false tfplan
  rules:
    - if: '$STAND_FQDN && !$STAND_ACTION && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "trigger")'
      when: manual

destroy:plan:
  resource_group: $STAND_FQDN
  stage: destroy
  rules:
    - if: '$STAND_ACTION == "destroy"'
  script:
    - |
      HOST="${STAND_FQDN%%.*}"
      [ -n "$HOST" ] || { echo "HOST пустой"; exit 1; }
    - *tf_backend
    - tofu init
    - tofu plan -destroy -out=tfplan-destroy
  artifacts:
    paths: [tfplan-destroy]

destroy:apply:
  resource_group: $STAND_FQDN
  stage: destroy
  needs: [destroy:plan]
  rules:
    - if: '$STAND_ACTION == "destroy"'
      when: manual
      allow_failure: false
  script:
    - |
      HOST="${STAND_FQDN%%.*}"
      [ -n "$HOST" ] || { echo "HOST пустой"; exit 1; }
    - *tf_backend
    - tofu init
    - tofu apply -auto-approve tfplan-destroy

archive:plan:
  stage: archive
  resource_group: $STAND_FQDN
  rules:
    - if: '$STAND_ACTION == "archive"'
  script:
    - |
      HOST="${STAND_FQDN%%.*}"
      [ -n "$HOST" ] || { echo "STAND_FQDN не задан"; exit 1; }
    - *tf_backend
    - tofu init
    - tofu state list | grep -q proxmox_virtual_environment_vm || { echo "state пустой - нечего архивировать"; exit 1; }
    - tofu plan -destroy -out=tfplan-archive
    - tofu show tfplan-archive
  artifacts:
    paths: [tfplan-archive]

archive:apply:
  stage: archive
  resource_group: $STAND_FQDN
  needs: [archive:plan]
  rules:
    - if: '$STAND_ACTION == "archive"'
      when: manual
      allow_failure: false
  variables:
    PVE_API: "https://10.205.251.3:8006/api2/json"
    BACKUP_STORAGE: "PBS"
  script:
    - apk add --no-cache jq curl
    - |
      HOST="${STAND_FQDN%%.*}"
      [ -n "$HOST" ] || { echo "STAND_FQDN не задан"; exit 1; }
    - *tf_backend
    - tofu init
    - |
      tofu show -json > cur.json
      Q='.values.root_module.resources[] | select(.type=="proxmox_virtual_environment_vm")'
      VMID=$(jq -r "$Q | .values.vm_id" cur.json)
      NODE=$(jq -r "$Q | .values.node_name" cur.json)
      for v in VMID NODE; do
        eval "val=\$$v"
        [ -n "$val" ] && [ "$val" != "null" ] || { echo "$v нет в state"; exit 1; }
      done
      echo "архивация $HOST -> VMID=$VMID на $NODE"

      AUTH="Authorization: PVEAPIToken=${PROXMOX_VE_API_TOKEN}"

      UPID=$(curl -sk -H "$AUTH" -X POST \
        "${PVE_API}/nodes/${NODE}/vzdump" \
        -d "vmid=${VMID}" \
        -d "storage=${BACKUP_STORAGE}" \
        -d "mode=stop" \
        -d "notes-template=${HOST}" \
        | jq -r '.data')
      [ -n "$UPID" ] && [ "$UPID" != "null" ] || { echo "vzdump не стартовал"; exit 1; }
      echo "task: $UPID"

      while :; do
        ST=$(curl -sk -H "$AUTH" "${PVE_API}/nodes/${NODE}/tasks/${UPID}/status" | jq -r '.data')
        [ "$(echo "$ST" | jq -r '.status')" = "stopped" ] && break
        sleep 15
      done
      EXIT=$(echo "$ST" | jq -r '.exitstatus')
      [ "$EXIT" = "OK" ] || { echo "backup FAILED: $EXIT"; exit 1; }

      echo "******** бэкап успешен ***********"
      curl -sk -H "$AUTH" \
        "${PVE_API}/nodes/${NODE}/storage/${BACKUP_STORAGE}/content?content=backup&vmid=${VMID}" \
        | jq -r '.data[].volid'
    - tofu apply -auto-approve tfplan-archive

unarchive:plan:
  stage: archive
  resource_group: $STAND_FQDN
  rules:
    - if: '$STAND_ACTION == "unarchive"'
  variables:
    PVE_API: "https://10.205.251.3:8006/api2/json"
    BACKUP_STORAGE: "PBS"
  script:
    - apk add --no-cache jq curl
    - |
      HOST="${STAND_FQDN%%.*}"
      [ -n "$HOST" ] || { echo "STAND_FQDN не задан"; exit 1; }
    - *tf_backend
    - tofu init
    - |
      if tofu state list | grep -q proxmox_virtual_environment_vm; then
        echo "стенд $HOST уже в state - он не в архиве"; exit 1
      fi
    - *find_backup

unarchive:apply:
  stage: archive
  resource_group: $STAND_FQDN
  needs: [unarchive:plan]
  timeout: 1h
  rules:
    - if: '$STAND_ACTION == "unarchive"'
      when: manual
      allow_failure: false
  variables:
    PVE_API: "https://10.205.251.3:8006/api2/json"
    BACKUP_STORAGE: "PBS"
    RESTORE_STORAGE: "LVMStor"
  script:
    - apk add --no-cache jq curl
    - |
      HOST="${STAND_FQDN%%.*}"
      [ -n "$HOST" ] || { echo "STAND_FQDN не задан"; exit 1; }
    - *tf_backend
    - tofu init
    - *find_backup
    - |
      # попытка занять прежний VMID, иначе берется новый VMID
      if curl -skf -H "$AUTH" "${PVE_API}/cluster/nextid?vmid=${OLDVMID}" >/dev/null 2>&1; then
        NEWVMID="$OLDVMID"
      else
        NEWVMID=$(curl -sk -H "$AUTH" "${PVE_API}/cluster/nextid" | jq -r '.data')
        echo "VMID $OLDVMID занят, берется новый $NEWVMID"
      fi
      [ -n "$NEWVMID" ] && [ "$NEWVMID" != "null" ] || { echo "не удалось получить VMID"; exit 1; }

      UPID=$(curl -sk -H "$AUTH" -X POST "${PVE_API}/nodes/${NODE}/qemu" \
        -d "vmid=${NEWVMID}" \
        -d "archive=${VOLID}" \
        -d "storage=${RESTORE_STORAGE}" \
        | jq -r '.data')
      [ -n "$UPID" ] && [ "$UPID" != "null" ] || { echo "restore не стартовал"; exit 1; }
      echo "task: $UPID"

       while :; do
         ST=$(curl -sk -H "$AUTH" "${PVE_API}/nodes/${NODE}/tasks/${UPID}/status" | jq -r '.data')
         [ "$(echo "$ST" | jq -r '.status')" = "stopped" ] && break
         sleep 10
      done
      [ "$(echo "$ST" | jq -r '.exitstatus')" = "OK" ] \
        || { echo "restore FAILED: $(echo "$ST" | jq -r '.exitstatus')"; exit 1; }
      echo "восстановлено: VMID=$NEWVMID"
    - |
      CFG=$(curl -sk -H "$AUTH" "${PVE_API}/nodes/${NODE}/qemu/${NEWVMID}/config" | jq -r '.data')
      CORES=$(echo "$CFG" | jq -r '.cores')
      SOCK=$(echo "$CFG" | jq -r '.sockets // 1')
      MEM=$(echo "$CFG" | jq -r '.memory')
      SCSI0=$(echo "$CFG" | jq -r '.scsi0')
      NET0=$(echo "$CFG" | jq -r '.net0')
      VD=$(echo "$CFG" | jq -r '.cicustom // ""')

      DISK=$(echo "$SCSI0"  | sed -n 's/.*size=\([0-9]\+\)G.*/\1/p')
      MAC=$(echo "$NET0"    | sed -n 's/.*virtio=\([0-9A-Fa-f:]\+\).*/\1/p')
      VLAN=$(echo "$NET0"   | sed -n 's/.*tag=\([0-9]\+\).*/\1/p')

      case "$VD" in *astra*) OS=astra ;; *) OS=redos ;; esac

      for v in CORES MEM DISK MAC VLAN; do
        eval "val=\$$v"
        [ -n "$val" ] || { echo "$v не разобран из конфига ВМ"; exit 1; }
      done

      cat > pipeline.auto.tfvars <<EOF
      stand_os = "${OS}"
      pool_id = "NONAME"
      vms = {
        "${HOST}" = {
          cores = ${CORES}
          sockets = ${SOCK}
          memory = ${MEM}
          disk = ${DISK}
          vlan_id = ${VLAN}
          mac_address = "${MAC}"
          on_boot = false
          started = true
          backup = true
        }
      }
      EOF

      cat > import.tf <<EOF
      import {
        to = proxmox_virtual_environment_vm.this["${HOST}"]
        id = "${NODE}/${NEWVMID}"
      }
      EOF

      cat pipeline.auto.tfvars import.tf
    - tofu plan -out=tfplan-unarchive
    - tofu show tfplan-unarchive
    - |
      tofu show -json tfplan-unarchive \
        | jq -e '[.resource_changes[].change.actions[]] | index("delete") | not' >/dev/null \
        || { echo "в plan содержится удаление - отказ"; exit 1; }
    - tofu apply -auto-aprove tfplan-unarchive
  artifacts:
    paths: [pipeline.auto.tfvars, import.tf]


default:
  image:
    name: ghcr.io/opentofu/opentofu:1.10.6
    entrypoint: [""]
  tags:
    - tf

stages:
  - validate
  - plan

validate:
  stage: validate 
  script:
    - tofu fmt -check -recursive -diff
    - tofu init -backend=false
    - tofu validate

plan:
  stage: plan
  script:
    - |
      echo "FQDN=$STAND_FQDN OS=$STAND_OS RAM=$STAND_RAM"
      HOST="${STAND_FQDN%%.*}"
      ZONE="${STAND_FQDN#*.}"
      if [ "$HOST" = "$ZONE" ]; then
        echo "STAND_FQDN должен быть FQDN: $STAND_FQDN"
        exit 1
      fi

      if [ "$STAND_RAM" -gt 50 ] 
        echo "Чрезмерное выделение RAM: $STAND_RAM > 50"
        exit 1
      fi
      
      case "$STAND_OS" in 
        redos|astra)
        ;;
        *)
        exit1
        ;;
      esac

      echo "$HOST | $ZONE"
  rules:
    - if: $STAND_FQDN == null || $STAND_OS == null || $STAND_RAM == null
      when: never
    - if: $CI_PIPELINE_SOURCE == "api"
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "web"
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "trigger"
      when: on_sucess
    - when: never
